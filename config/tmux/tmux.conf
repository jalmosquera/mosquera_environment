# Let tmux inherit the user's configured shell. Hard-coded Homebrew paths are not portable.

# Carga TPM
set -g @plugin 'tmux-plugins/tpm'

# Tested options for TMUX compatibility
set -g @plugin 'tmux-plugins/tmux-sensible'

# Clipboard management
set -g @plugin 'tmux-plugins/tmux-yank'

# Tmux Navigation
set -g @plugin 'christoomey/vim-tmux-navigator'

# Tmux Resurrect
set -g @plugin 'tmux-plugins/tmux-resurrect'

# Which Key
set -g @plugin 'alexwforsythe/tmux-which-key'

# Floating window
bind-key -n M-g if-shell -F '#{==:#{session_name},scratch}' {
  detach-client
} {
  # open in the same directory of the current pane
  display-popup -d "#{pane_current_path}" -E "tmux new-session -A -s scratch"
}

# Tokyo Night theme
set -g status-style 'bg=#16161e,fg=#a9b1d6'
set -g status-left-style 'bg=#16161e,fg=#7aa2f7,bold'
set -g status-right-style 'bg=#16161e,fg=#a9b1d6'
set -g window-status-style 'bg=#16161e,fg=#565f89'
set -g window-status-current-style 'bg=#292e42,fg=#c0caf5,bold'
set -g pane-border-style 'fg=#292e42'
set -g pane-active-border-style 'fg=#7aa2f7'
set -g message-style 'bg=#292e42,fg=#c0caf5'
set -g mode-style 'bg=#7aa2f7,fg=#1a1b26'

# --- terminal & key handling ---
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*:Tc"

set -s extended-keys off

# Modo vim
set -g mode-keys vi
if-shell 'command -v pbcopy >/dev/null 2>&1' \
  'bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"' \
  'if-shell "command -v wl-copy >/dev/null 2>&1" "bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel \"wl-copy\"" "if-shell \"command -v xclip >/dev/null 2>&1\" \"bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel \\\"xclip -in -selection clipboard\\\"\" \"bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel\""'

# Keymaps
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Create and switch to a named session: Ctrl+A, then Shift+N.
bind-key N command-prompt -p "New session:" "new-session -s '%%'"

# Move between panes: press Ctrl+A, release it, then use an arrow key.
bind-key -r Left select-pane -L
bind-key -r Right select-pane -R
bind-key -r Up select-pane -U
bind-key -r Down select-pane -D

unbind %
unbind '"'
bind v split-window -h -c "#{pane_current_path}"
bind d split-window -v -c "#{pane_current_path}"

# Mouse support
set -g mouse on

# Status bar position
set -g status-position top

# Clear screen (vim-tmux-navigator captures ctrl+l)
bind C-l send-keys C-l

# Kill all sessions except current
bind K confirm-before -p "Kill all other sessions? (y/n)" "kill-session -a"

# Fix index
set -g base-index 1
setw -g pane-base-index 1

# TPM init
run '~/.tmux/plugins/tpm/tpm'
